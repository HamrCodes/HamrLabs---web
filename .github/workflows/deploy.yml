name: Deploy to Active24

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Host and document root are not secrets (the host is just the public domain,
# /web is Active24's standard docroot). Only the FTP username + password and
# the Web3Forms key are real secrets, kept in repo Settings -> Secrets.
env:
  FTP_HOST: hamrlabs.cz
  FTP_REMOTE_DIR: /web/

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile-exact)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}

      # Hard gate: if the build didn't produce a real export, stop before
      # anything ships. Never publish a broken/partial site.
      - name: Verify export output
        run: |
          test -f out/index.html
          test -f out/.htaccess
          test -f out/404.html
          echo "Export looks complete: $(find out -type f | wc -l) files"

      - name: Deploy to Active24 (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.ACTIVE24_FTP_USERNAME }}
          password: ${{ secrets.ACTIVE24_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ env.FTP_REMOTE_DIR }}
          # The FTP account is jailed to /hamrlabs.cz and this uploads only into
          # /web, so the other two domains on this hosting are untouchable.
          # Content-hashed _next/static filenames would otherwise pile up over
          # time, so mirror-delete keeps /web an exact copy of the build.
          dangerous-clean-slate: true
