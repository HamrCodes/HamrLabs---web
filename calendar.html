<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hamr Labs / Booking kalendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --black:    #0A0A0A;
  --dark:     #1E1E1E;
  --grey:     #2D2D2D;
  --white:    #F5F5F5;
  --frost:    #F0FAFA;
  --cyan:     #00F0FF;
  --teal:     #00B8C8;

  --muted:    rgba(245,245,245,0.55);
  --subtle:   rgba(245,245,245,0.35);
  --rule:     rgba(245,245,245,0.08);
  --rule-2:   rgba(245,245,245,0.15);
  --cyan-08:  rgba(0,240,255,0.08);
  --cyan-15:  rgba(0,240,255,0.15);
  --cyan-40:  rgba(0,240,255,0.40);

  --font-display: 'Audiowide', system-ui, sans-serif;
  --font-label:   'Space Grotesk', system-ui, sans-serif;
  --font-body:    'Inter', system-ui, sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;background:var(--black);color:var(--white);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:transparent;color:inherit;padding:0}
::selection{background:var(--cyan);color:var(--black)}

.page{
  min-height:100vh;
  display:grid;place-items:center;
  padding:48px 24px;
}

.card{
  width:100%;
  max-width:680px;
  background:var(--dark);
  border:1px solid var(--rule-2);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg, transparent, var(--cyan-40), transparent);
}

.head{
  padding:40px 40px 32px;
  border-bottom:1px solid var(--rule);
}
.eyebrow{
  display:inline-flex;align-items:center;gap:12px;
  font-family:var(--font-label);
  font-size:11px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--cyan);
  margin-bottom:18px;
}
.eyebrow::before{
  content:"";width:8px;height:8px;background:var(--cyan);
  border-radius:50%;
  animation:pulse 1.8s infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.4;transform:scale(0.6)}
}
.title{
  font-family:var(--font-display);
  font-size:clamp(28px, 4vw, 40px);
  line-height:1.1;letter-spacing:0;
  margin:0 0 14px;
  color:var(--frost);
}
.lead{
  font-family:var(--font-body);
  font-size:15px;line-height:1.55;
  color:var(--muted);
  max-width:46ch;margin:0;
}

.weeknav{
  padding:20px 40px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--rule);
}
.weeknav .label{
  font-family:var(--font-label);
  font-size:13px;font-weight:500;letter-spacing:0.02em;
  color:var(--white);
}
.weeknav .label .span{color:var(--muted);font-weight:400;margin-left:10px;font-size:12px}
.weeknav button{
  width:36px;height:36px;
  border:1px solid var(--rule-2);
  display:grid;place-items:center;
  font-family:var(--font-label);font-size:14px;
  color:var(--white);
  transition:all .18s ease;
}
.weeknav button:hover:not(:disabled){
  border-color:var(--cyan);color:var(--cyan);
  background:var(--cyan-08);
}
.weeknav button:disabled{
  color:var(--subtle);cursor:not-allowed;
  border-color:var(--rule);
}
.weeknav .actions{display:flex;gap:8px}

.grid{
  padding:32px 40px;
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:14px;
}
.day{
  display:flex;flex-direction:column;gap:10px;
}
.day-head{
  padding:0 0 14px;
  border-bottom:1px solid var(--rule);
  margin-bottom:6px;
}
.day-name{
  font-family:var(--font-label);
  font-size:12px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;
  color:var(--cyan);
}
.day-date{
  font-family:var(--font-display);
  font-size:20px;line-height:1.1;
  color:var(--frost);
  margin-top:6px;
}
.day-date .month{
  font-family:var(--font-label);
  font-size:11px;color:var(--muted);
  letter-spacing:0.08em;text-transform:uppercase;
  display:inline-block;margin-left:6px;
  vertical-align:middle;
  font-weight:500;
}

.slot{
  font-family:var(--font-label);
  font-size:13px;font-weight:500;
  letter-spacing:0.02em;
  padding:12px 8px;
  border:1px solid var(--rule-2);
  background:var(--black);
  color:var(--white);
  text-align:center;
  transition:all .18s ease;
  position:relative;
  font-variant-numeric:tabular-nums;
}
.slot:hover:not(:disabled):not(.selected){
  border-color:var(--cyan);
  color:var(--cyan);
  background:var(--cyan-08);
}
.slot.selected{
  background:var(--cyan);
  color:var(--black);
  border-color:var(--cyan);
  font-weight:600;
}
.slot.booked{
  color:var(--subtle);
  background:transparent;
  border-color:var(--rule);
  cursor:not-allowed;
  text-decoration:line-through;
  text-decoration-color:var(--rule-2);
}
.slot.booked::after{
  content:"obsazeno";
  position:absolute;
  bottom:-16px;left:0;right:0;
  font-size:9px;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--subtle);
  text-decoration:none;
  opacity:0;transition:opacity .18s ease;
}
.slot.booked:hover::after{opacity:1}
.slot.past{
  color:var(--subtle);
  background:transparent;
  border-color:var(--rule);
  cursor:not-allowed;
  opacity:0.5;
}

.confirm{
  padding:24px 40px 40px;
  border-top:1px solid var(--rule);
  display:flex;align-items:center;justify-content:space-between;gap:24px;
  flex-wrap:wrap;
}
.confirm-info{
  display:flex;flex-direction:column;gap:4px;
  min-width:0;
}
.confirm-label{
  font-family:var(--font-label);
  font-size:11px;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--muted);
  font-weight:500;
}
.confirm-value{
  font-family:var(--font-body);
  font-size:16px;color:var(--white);
  font-weight:500;
}
.confirm-value.empty{color:var(--subtle);font-weight:400}
.confirm-value .accent{color:var(--cyan);font-weight:600}

.btn{
  font-family:var(--font-body);
  font-size:14px;font-weight:500;letter-spacing:0.02em;
  padding:14px 24px;
  background:var(--cyan);
  color:var(--black);
  border:1px solid var(--cyan);
  display:inline-flex;align-items:center;gap:10px;
  transition:all .2s cubic-bezier(.2,.7,.2,1);
  white-space:nowrap;
}
.btn:hover:not(:disabled){
  background:var(--teal);
  border-color:var(--teal);
  color:var(--black);
}
.btn .arrow{transition:transform .2s ease}
.btn:hover:not(:disabled) .arrow{transform:translateX(4px)}
.btn:disabled{
  background:transparent;color:var(--subtle);
  border-color:var(--rule-2);
  cursor:not-allowed;
}
.btn.sent{
  background:var(--teal);border-color:var(--teal);
  color:var(--black);pointer-events:none;
}

.foot{
  padding:18px 40px;
  border-top:1px solid var(--rule);
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--font-label);font-size:11px;
  letter-spacing:0.08em;text-transform:uppercase;
  color:var(--muted);
}
.foot .dot{color:var(--cyan);margin:0 8px}

/* Responsive */
@media (max-width: 640px){
  .head{padding:28px 24px 24px}
  .weeknav{padding:16px 24px}
  .grid{padding:24px 24px;gap:10px}
  .day-date{font-size:17px}
  .day-date .month{display:block;margin-left:0;margin-top:2px}
  .slot{padding:10px 4px;font-size:12px}
  .confirm{padding:20px 24px 28px;flex-direction:column;align-items:stretch;gap:18px}
  .btn{justify-content:center;width:100%}
  .foot{padding:14px 24px;flex-direction:column;gap:6px;text-align:center}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<main class="page">

  <section class="card" aria-label="Booking kalendar">

    <header class="head">
      <span class="eyebrow">Dostupne terminy</span>
      <h2 class="title">Domluvit hovor</h2>
      <p class="lead">Vyber si termín, který ti vyhovuje. Ozvu se 24 hodin před hovorem s upřesněním.</p>
    </header>

    <div class="weeknav">
      <div class="label">
        <span id="weekRange">26. května až 30. května 2026</span>
        <span class="span" id="weekIndex">Tento týden</span>
      </div>
      <div class="actions">
        <button id="prevWeek" aria-label="Předchozí týden" disabled>←</button>
        <button id="nextWeek" aria-label="Další týden">→</button>
      </div>
    </div>

    <div class="grid" id="grid">
      <!-- Days injected by JS -->
    </div>

    <div class="confirm">
      <div class="confirm-info">
        <span class="confirm-label">Vybraný termín</span>
        <span class="confirm-value empty" id="confirmValue">Žádný termín nevybrán</span>
      </div>
      <button class="btn" id="confirmBtn" disabled>
        Potvrdit termín <span class="arrow">→</span>
      </button>
    </div>

    <footer class="foot">
      <span>Hovor trvá 30 minut <span class="dot">·</span> Google Meet</span>
      <span>Časové pásmo: Europe/Prague</span>
    </footer>

  </section>

</main>

<script>
(() => {
  // Constants
  const ALLOWED_DAYS = [2, 3, 4]; // Tue, Wed, Thu (0=Sun)
  const SLOTS = ['11:00', '13:00', '15:00', '17:00'];

  // Mock booked slots (date ISO -> array of times)
  const BOOKED = {
    '2026-05-27': ['11:00', '15:00'],
    '2026-05-28': ['13:00'],
    '2026-06-02': ['17:00'],
    '2026-06-04': ['11:00', '13:00'],
    '2026-06-09': ['15:00'],
    '2026-06-10': ['11:00'],
    '2026-06-11': ['13:00', '17:00'],
  };

  // Czech locale formatting
  const DAY_FULL = ['neděle','pondělí','úterý','středa','čtvrtek','pátek','sobota'];
  const DAY_SHORT = ['ne','po','út','st','čt','pá','so'];
  const MONTHS_GEN = ['ledna','února','března','dubna','května','června','července','srpna','září','října','listopadu','prosince'];
  const MONTHS_NOM = ['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];

  // State
  const now = new Date(2026, 4, 26); // Mock "today" = May 26 2026 (Tue)
  let baseMonday = startOfWeek(now);
  let weekOffset = 0;
  let selected = null; // { date: 'YYYY-MM-DD', time: 'HH:MM', dayName, fullDate }

  function startOfWeek(d){
    const day = d.getDay();
    const diff = (day === 0 ? -6 : 1 - day);
    const m = new Date(d);
    m.setDate(d.getDate() + diff);
    m.setHours(0,0,0,0);
    return m;
  }

  function addDays(d, n){
    const r = new Date(d);
    r.setDate(d.getDate() + n);
    return r;
  }

  function isoDate(d){
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function isPast(d){
    const today = new Date(now);
    today.setHours(0,0,0,0);
    return d < today;
  }

  function isBooked(date, time){
    const iso = isoDate(date);
    return (BOOKED[iso] || []).includes(time);
  }

  function fmtDayName(d){
    return DAY_SHORT[d.getDay()];
  }
  function fmtDate(d){
    return `${d.getDate()}.`;
  }
  function fmtMonth(d){
    return MONTHS_GEN[d.getMonth()];
  }

  function fmtRange(start, end){
    if (start.getMonth() === end.getMonth()){
      return `${start.getDate()}. až ${end.getDate()}. ${MONTHS_GEN[end.getMonth()]} ${end.getFullYear()}`;
    }
    return `${start.getDate()}. ${MONTHS_GEN[start.getMonth()]} až ${end.getDate()}. ${MONTHS_GEN[end.getMonth()]} ${end.getFullYear()}`;
  }

  function fmtConfirm(date, time){
    const dayName = DAY_FULL[date.getDay()];
    return `${dayName} ${date.getDate()}. ${MONTHS_GEN[date.getMonth()]} v ${time}`;
  }

  function renderWeek(){
    const monday = addDays(baseMonday, weekOffset * 7);
    const days = ALLOWED_DAYS.map(dow => addDays(monday, dow - 1)); // tue, wed, thu

    // Header
    document.getElementById('weekRange').textContent = fmtRange(days[0], days[days.length - 1]);
    document.getElementById('weekIndex').textContent =
      weekOffset === 0 ? 'Tento týden' :
      weekOffset === 1 ? 'Příští týden' :
      `+${weekOffset} týdny`;

    document.getElementById('prevWeek').disabled = weekOffset <= 0;
    document.getElementById('nextWeek').disabled = weekOffset >= 3;

    // Grid
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    days.forEach(date => {
      const day = document.createElement('div');
      day.className = 'day';
      const past = isPast(date);

      day.innerHTML = `
        <div class="day-head">
          <div class="day-name">${fmtDayName(date)}</div>
          <div class="day-date">${fmtDate(date)}<span class="month">${fmtMonth(date)}</span></div>
        </div>
      `;

      SLOTS.forEach(time => {
        const btn = document.createElement('button');
        btn.className = 'slot';
        btn.type = 'button';
        btn.textContent = time;

        if (past){
          btn.classList.add('past');
          btn.disabled = true;
        } else if (isBooked(date, time)){
          btn.classList.add('booked');
          btn.disabled = true;
          btn.setAttribute('aria-label', `${time}, obsazeno`);
        } else {
          btn.addEventListener('click', () => selectSlot(date, time, btn));
        }

        if (selected && selected.date === isoDate(date) && selected.time === time){
          btn.classList.add('selected');
        }

        day.appendChild(btn);
      });

      grid.appendChild(day);
    });
  }

  function selectSlot(date, time, btn){
    selected = {
      date: isoDate(date),
      time,
      label: fmtConfirm(date, time),
    };
    document.querySelectorAll('.slot.selected').forEach(s => s.classList.remove('selected'));
    btn.classList.add('selected');

    const val = document.getElementById('confirmValue');
    val.classList.remove('empty');
    val.innerHTML = `<span class="accent">${selected.label}</span>`;

    document.getElementById('confirmBtn').disabled = false;
  }

  // Nav
  document.getElementById('prevWeek').addEventListener('click', () => {
    if (weekOffset > 0){ weekOffset--; renderWeek(); }
  });
  document.getElementById('nextWeek').addEventListener('click', () => {
    if (weekOffset < 3){ weekOffset++; renderWeek(); }
  });

  // Submit (mock)
  const confirmBtn = document.getElementById('confirmBtn');
  confirmBtn.addEventListener('click', () => {
    if (!selected) return;
    const original = confirmBtn.innerHTML;
    confirmBtn.classList.add('sent');
    confirmBtn.innerHTML = 'Termín potvrzen ✓';
    confirmBtn.disabled = true;
    setTimeout(() => {
      confirmBtn.classList.remove('sent');
      confirmBtn.innerHTML = original;
      confirmBtn.disabled = false;
    }, 2400);
  });

  renderWeek();
})();
</script>
</body>
</html>
